{{- if not .Values.proofKey.existingSecret }}
{{- $name := include "sumoffice.proofSecretName" . }}
{{- $pem := .Values.proofKey.pem }}
{{- if not $pem }}
{{- /* Keep the key across upgrades: a new key would invalidate the one WOPI hosts cached from discovery. */}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- if and $existing $existing.data (index $existing.data "proof-key.pem") }}
{{- $pem = index $existing.data "proof-key.pem" | b64dec }}
{{- else }}
{{- $pem = genPrivateKey "rsa" }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "sumoffice.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  proof-key.pem: {{ $pem | b64enc | quote }}
{{- end }}
