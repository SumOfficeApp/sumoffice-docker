{% set tpl = ix_lib.base.render.Render(values) %}

{% set c1 = tpl.add_container(values.consts.sumoffice_container_name, "image") %}
{% set perm_container = tpl.deps.perms(values.consts.perms_container_name) %}
{% set perms_config = {"uid": values.run_as.user, "gid": values.run_as.group, "mode": "check"} %}

{% do c1.set_user(values.run_as.user, values.run_as.group) %}
{% do c1.healthcheck.set_custom_test("node -e 'require(\"http\").get(\"http://127.0.0.1:%d/health\",r=>process.exit(r.statusCode===200?0:1)).on(\"error\",()=>process.exit(1))'" | format(values.network.web_port.port_number)) %}

{% do c1.environment.add_env("FRONT_PORT", values.network.web_port.port_number) %}
{% do c1.environment.add_env("PUBLIC_URL", values.sumoffice.public_url.rstrip("/")) %}
{% do c1.environment.add_env("NEXTCLOUD_HOST", values.sumoffice.wopi_host) %}
{% if values.sumoffice.wopi_url %}
  {% do c1.environment.add_env("NEXTCLOUD_URL", values.sumoffice.wopi_url.rstrip("/")) %}
{% endif %}
{% do c1.environment.add_env("MAX_CABINS", values.sumoffice.max_cabins) %}
{% do c1.environment.add_env("HOME", "/data/home") %}
{% do c1.environment.add_user_envs(values.sumoffice.additional_envs) %}

{% do c1.add_port(values.network.web_port) %}

{% do c1.add_storage("/data", values.storage.data) %}
{% do perm_container.add_or_skip_action("data", values.storage.data, perms_config) %}

{% for store in values.storage.additional_storage %}
  {% do c1.add_storage(store.mount_path, store) %}
  {% do perm_container.add_or_skip_action(store.mount_path, store, perms_config) %}
{% endfor %}

{% if perm_container.has_actions() %}
  {% do perm_container.activate() %}
  {% do c1.depends.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
{% endif %}

{% do tpl.portals.add(values.network.web_port, {"name": "Discovery", "path": "/hosting/discovery"}) %}

{{ tpl.render() | tojson }}
