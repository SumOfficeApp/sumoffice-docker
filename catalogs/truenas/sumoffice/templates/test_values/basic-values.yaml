resources:
  limits:
    cpus: 2.0
    memory: 4096

TZ: Etc/UTC

sumoffice:
  public_url: http://localhost:30093
  wopi_host: localhost
  wopi_url: http://localhost
  max_cabins: 4
  additional_envs: []

network:
  host_network: false
  web_port:
    bind_mode: published
    port_number: 30093

run_as:
  user: 568
  group: 568

ix_volumes:
  data: /opt/tests/mnt/data

storage:
  data:
    type: ix_volume
    ix_volume_config:
      dataset_name: data
      create_host_path: true
  additional_storage: []
