[Application]
ID = sumoffice
; Code is a two-letter code assigned by Univention in the App Provider Portal.
Code = XX
Name = SumOffice
Version = 2026.3
Vendor = SumOffice
WebsiteVendor = https://sumoffice.com
Maintainer = SumOffice
WebsiteMaintainer = https://github.com/SumOfficeApp/sumoffice-docker
Website = https://github.com/SumOfficeApp/sumoffice-docker
SupportURL = https://github.com/SumOfficeApp/sumoffice-docker/issues
Contact = hello@sumoffice.com
NotificationEmail = hello@sumoffice.com
Description = Excel- and Word-compatible web editors for Nextcloud Office (WOPI)
LongDescription = <p>SumOffice adds two browser editors to Nextcloud Office and other WOPI hosts:
	<b>SumSheet</b> for Excel workbooks (.xlsx, .xlsm, .xlsb; VBA kept byte for byte) and
	<b>SumDoc</b> for Word documents (.docx).</p>
	<p>Files stay in your storage; the editors have no user database of their own.</p>
	<p>The editors are free for evaluation; production use inside an organisation is licensed per
	application: <a href="https://sumoffice.com/download#server">sumoffice.com/download</a>.</p>
Categories = Office, Collaboration
License = proprietary
SupportedUCSVersions = 5.2-2
; Multi-container app: the compose file in this folder defines the service below.
DockerMainService = sumoffice
; SumOffice and Collabora both serve /hosting/discovery and both take over Nextcloud Office.
ConflictedApps = collabora, collabora-online
; The editors live at /f1, /a4 and /hosting/* of this host; the inst script adds the Apache proxy for them.
AutoModProxy = False
WebInterface = /hosting/discovery
WebInterfaceName = SumOffice WOPI discovery
UCSOverviewCategory = False
MinPhysicalRAM = 4096
