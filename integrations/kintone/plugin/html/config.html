<section class="sumoffice-config" style="padding:16px;max-width:640px">
  <h2>SumOffice</h2>
  <p>The address of your SumOffice bridge and the secret you gave it in <code>BRIDGE_SECRET</code>.
     kintone keeps the secret on its side and adds it only to the plugin's calls to the bridge.</p>
  <p><label>Bridge URL<br><input id="sumoffice-bridge-url" type="url" style="width:100%" placeholder="https://sumoffice-kintone.example.com"></label></p>
  <p><label>Bridge secret<br><input id="sumoffice-secret" type="password" style="width:100%" autocomplete="off"></label></p>
  <p><button id="sumoffice-save" class="kintoneplugin-button-dialog-ok" type="button">Save</button>
     <button id="sumoffice-cancel" class="kintoneplugin-button-dialog-cancel" type="button">Cancel</button></p>
</section>
