# One origin for both editors — Nextcloud's CSP allows exactly one.
server {
  listen 8093;
  client_max_body_size 200m;
  proxy_http_version 1.1;
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $http_connection;
  proxy_read_timeout 3600s;
  proxy_buffering off;
  location /hosting/ { proxy_pass http://discovery:8093; }
  location /f1/ { proxy_pass http://sumsheet:8092; }
  location = /f1 { proxy_pass http://sumsheet:8092; }
  location /a4/ { proxy_pass http://sumdoc:8090; }
  location = /a4 { proxy_pass http://sumdoc:8090; }
  location / { return 404; }
}
