# One origin for all editors — Nextcloud's CSP allows exactly one.
server {
  listen 8093;
  client_max_body_size 200m;
  proxy_http_version 1.1;
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $http_connection;
  proxy_read_timeout 3600s;
  proxy_buffering off;
  # Names are looked up again on every request (Docker's DNS, short cache). With a plain
  # `proxy_pass http://name:port` nginx keeps the address it saw at start, and after any
  # editor restart (crash, update, `restart: unless-stopped`) the editor gets a new address
  # and every request answers 502 until nginx itself is restarted.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $discovery http://discovery:8093;
  set $sumsheet http://sumsheet:8092;
  set $sumdoc http://sumdoc:8090;
  set $sumslide http://sumslide:8094;
  location /hosting/ { proxy_pass $discovery; }
  location /sheets/ { proxy_pass $sumsheet; }
  location = /sheets { proxy_pass $sumsheet; }
  location /docs/ { proxy_pass $sumdoc; }
  location = /docs { proxy_pass $sumdoc; }
  location /slides/ { proxy_pass $sumslide; }
  location / { return 404; }
}
